name: V52 Verify Backend and Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend V52
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract V52
        shell: bash
        run: |
          set -euo pipefail
          test -f saldo_cero_v52_android_compile.zip
          rm -rf v52
          mkdir -p v52
          unzip -q saldo_cero_v52_android_compile.zip -d v52

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(find v52 -type f -name 'V52_STATUS.md' -print -quit | xargs -r dirname)"
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend install
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Backend build
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: npm run build

      - name: Backend verification
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: npm run verify:v52

  android:
    name: Android V52 APK + AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract V52
        shell: bash
        run: |
          set -euo pipefail
          test -f saldo_cero_v52_android_compile.zip
          rm -rf v52
          mkdir -p v52
          unzip -q saldo_cero_v52_android_compile.zip -d v52

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_ROOT="$(find v52 -type f -name 'V52_STATUS.md' -print -quit | xargs -r dirname)"
          test -n "$PROJECT_ROOT"
          test -d "$PROJECT_ROOT/android"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android debug APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: gradle --no-daemon clean assembleDebug

      - name: Android release AAB
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: gradle --no-daemon bundleRelease

      - name: Verify APK + AAB
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs -type f -name '*.apk' | head -1)"
          AAB="$(find app/build/outputs -type f -name '*.aab' | head -1)"
          test -n "$APK"
          test -n "$AAB"
          sha256sum "$APK" "$AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: saldo-cero-v52-android
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ env.PROJECT_ROOT }}/android/app/build/outputs/**/*.apk
            ${{ env.PROJECT_ROOT }}/android/app/build/outputs/**/*.aab
