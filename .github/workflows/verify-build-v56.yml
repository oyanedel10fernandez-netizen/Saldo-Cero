name: V56 Verify Backend and Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:

  backend:
    name: Backend V56
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract V56
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'saldo_cero_v56*.zip' -print -quit)"

          echo "ZIP encontrado: $ZIP_FILE"

          test -n "$ZIP_FILE"

          rm -rf v56
          mkdir -p v56

          unzip -q "$ZIP_FILE" -d v56

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find v56 -type f -name 'V56_STATUS.md' -print -quit | xargs -r dirname)"

          echo "PROJECT_ROOT=$PROJECT_ROOT"

          test -n "$PROJECT_ROOT"
          test -d "$PROJECT_ROOT/backend"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Backend install
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund

      - name: Backend build
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: |
          npm run build

      - name: Backend verification
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: |
          npm run verify:v56

      - name: Backend evidence
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/server.js

          mkdir -p ../artifacts

          echo "BACKEND_V56=PASS" \
            | tee ../artifacts/backend-pass-v56.txt

      - uses: actions/upload-artifact@v4
        with:
          name: backend-pass-evidence-v56
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.PROJECT_ROOT }}/artifacts/backend-pass-v56.txt


  android:
    name: Android V56 APK + AAB
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Extract V56
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'saldo_cero_v56*.zip' -print -quit)"

          echo "ZIP encontrado: $ZIP_FILE"

          test -n "$ZIP_FILE"

          rm -rf v56
          mkdir -p v56

          unzip -q "$ZIP_FILE" -d v56

      - name: Locate project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT="$(find v56 -type f -name 'V56_STATUS.md' -print -quit | xargs -r dirname)"

          echo "PROJECT_ROOT=$PROJECT_ROOT"

          test -n "$PROJECT_ROOT"
          test -d "$PROJECT_ROOT/android"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android debug APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Android release AAB
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          gradle --no-daemon bundleRelease

      - name: Verify APK + AAB
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs -type f -name '*.apk' | head -1)"
          AAB="$(find app/build/outputs -type f -name '*.aab' | head -1)"

          echo "APK: $APK"
          echo "AAB: $AAB"

          test -n "$APK"
          test -n "$AAB"

          rm -rf artifacts
          mkdir -p artifacts

          cp "$APK" artifacts/
          cp "$AAB" artifacts/

          {
            echo "V56_ANDROID_BUILD=PASS"
            echo "APK=$(basename "$APK")"
            echo "AAB=$(basename "$AAB")"
            echo "APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')"
            echo "AAB_SHA256=$(sha256sum "$AAB" | awk '{print $1}')"
          } | tee artifacts/release-evidence-v56.txt

      - uses: actions/upload-artifact@v4
        with:
          name: saldo-cero-v56-android
          if-no-files-found: error
          retention-days: 14
          path: ${{ env.PROJECT_ROOT }}/android/artifacts/
