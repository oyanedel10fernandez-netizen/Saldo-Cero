name: V47 Verify Backend and Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V47
        run: |
          test -f saldo_cero_v47_build_evidence.zip
          rm -rf v47
          mkdir v47
          unzip -q saldo_cero_v47_build_evidence.zip -d v47
      - name: Locate project
        run: |
          PROJECT_ROOT=$(find v47 -type f -name "V47_STATUS.md" -print -quit | xargs dirname)
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_ROOT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend install
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Backend build
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: npm run build
      - name: Backend verification
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: npm run verify:v47
      - name: Backend evidence
        working-directory: ${{ env.PROJECT_ROOT }}/backend
        run: |
          test -f dist/server.js
          mkdir -p ../artifacts
          { echo "BACKEND_BUILD=PASS"; echo "DIST=PASS"; } | tee ../artifacts/backend-pass.txt
      - uses: actions/upload-artifact@v4
        with:
          name: backend-pass-evidence-v47
          path: ${{ env.PROJECT_ROOT }}/artifacts/backend-pass.txt

  android:
    name: Android debug + release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract V47
        run: |
          test -f saldo_cero_v47_build_evidence.zip
          rm -rf v47
          mkdir v47
          unzip -q saldo_cero_v47_build_evidence.zip -d v47
      - name: Locate project
        run: |
          PROJECT_ROOT=$(find v47 -type f -name "V47_STATUS.md" -print -quit | xargs dirname)
          test -n "$PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android debug build
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: gradle --no-daemon clean assembleDebug
      - name: Android release AAB
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: gradle --no-daemon bundleRelease
      - name: Verify AAB
        working-directory: ${{ env.PROJECT_ROOT }}/android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -n "$AAB"
          sha256sum "$AAB" | tee aab-sha256.txt
          echo "AAB_BUILD=PASS" | tee -a aab-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: saldo-cero-v47-aab
          path: |
            ${{ env.PROJECT_ROOT }}/android/app/build/outputs/bundle/release/*.aab
            ${{ env.PROJECT_ROOT }}/android/aab-sha256.txt
